apiVersion: v1
kind: Pod
metadata:
  name: cdf-s1-writer
spec:
  runtimeClassName: kata
  restartPolicy: Never
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cdf-s1-pvc
