apiVersion: v1
kind: Pod
metadata:
  name: cdf-s4-pod2
spec:
  runtimeClassName: kata-remote
  restartPolicy: Never
  containers:
    - name: app
      image: ubuntu:22.04
      command: ["sleep", "infinity"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: cdf-s4-pvc
