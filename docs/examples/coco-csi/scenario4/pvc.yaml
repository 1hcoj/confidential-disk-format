apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdf-s4-pvc
  annotations:
    cdf.confidentialcontainers.org/kbs-key-id: "kbs:///default/cdf/my-pvc-key"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: cdf-crypt-integrity-peerpods
