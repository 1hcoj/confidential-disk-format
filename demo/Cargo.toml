[package]
name = "cdf-gpt"
version = "0.1.0"
edition = "2021"
description = "CDF v1 GPT profile demo tool (info / create / open-or-initialize)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cdf-gpt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
