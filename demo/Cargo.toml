[package]
name = "cdf-gpt"
version = "0.1.0"
edition = "2021"
description = "CDF v1 GPT profile demo tool (info / create / open)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "cdf-gpt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cdf = { path = "../cdf" }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
