[package]
name = "cdf"
version = "0.1.0"
edition = "2021"
description = "CDF v1 GPT profile: on-disk format, key hierarchy, create / open"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
